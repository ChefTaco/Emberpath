name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The image builds on Node 24 and runs on the Node 26 runtime image; test both.
        node-version: [24.22.3, 26.13.1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: sudo apt-get update -qq && sudo apt-get install -y ripgrep
      - run: npm run bootstrap
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run check:openapi
      - run: bash scripts/privacy-output.test.sh
      - run: npm run scan:secrets
      - run: npm run check:private
